<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Current Fire Status</title>
  <link rel="stylesheet" href="homepage-status.css">
</head>

<body>

  <main aria-labelledby="fire-status-heading">

  <header class="status-header">

  <div class="status-title-group">

    <h1 id="fire-status-heading">
      Current Fire Status
    </h1>

    <p class="status-subtitle">
      DFPA Protected Lands
      <span aria-hidden="true">|</span>
      Douglas District
    </p>

    <p
      id="fire-season-status"
      class="fire-season-indicator"
      aria-live="polite"
    >
      Loading status...
    </p>

  </div>

  <p class="prevention-message">
    Know Before You Go
    <span aria-hidden="true">|</span>
    Prevent Wildfires
    <span aria-hidden="true">|</span>
    Keep Oregon Green
  </p>

</header>

    <div class="status-grid">

      <!-- Fire Danger / Public Use Restrictions -->

      <section
        class="status-card"
        id="fire-danger-card"
        aria-labelledby="fire-danger-heading"
      >

        <div class="status-icon" aria-hidden="true">
          <svg
            viewBox="0 0 64 64"
            role="img"
            focusable="false"
          >
            <path
              d="M32 4 20 24h7L14 43h8v13h20V43h8L37 24h7L32 4z"
            />
          </svg>
        </div>

        <div class="status-card-content">

          <h2 id="fire-danger-heading">
            Fire Danger /<br>
            Public Use Restrictions
          </h2>

          <p
            id="fire-danger-status"
            class="status-pill"
            aria-live="polite"
          >
            Loading current status...
          </p>

          <!--
            Retained temporarily for compatibility with the
            current JavaScript. It will be removed from the
            visible/accessibility structure when the JS is updated.
          -->
          <span
            id="public-use-status"
            hidden
          ></span>

        </div>

      </section>


      <!-- Industrial Fire Precaution Level -->

      <section
        class="status-card"
        id="ifpl-card"
        aria-labelledby="ifpl-heading"
      >

        <div class="status-icon" aria-hidden="true">
          <svg
            viewBox="0 0 64 64"
            role="img"
            focusable="false"
          >
            <path
              d="M34 3c2 12-6 16-2 25 2-5 7-8 9-15 8 8 13 17 13 27
              0 12-9 21-22 21S10 52 10 40c0-11 7-20 18-30
              -1 9 1 14 5 18 2-6 2-13 1-25z"
            />
          </svg>
        </div>

        <div class="status-card-content">

          <h2 id="ifpl-heading">
            Industrial Fire<br>
            Precaution Level
          </h2>

          <div
            id="ifpl-status"
            aria-live="polite"
            aria-label="Current Industrial Fire Precaution Level"
          >
            <p>Loading current industrial fire precaution levels...</p>
          </div>

        </div>

      </section>

    </div>

  </main>

  <script src="homepage-status.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        DFPA Public Use Restriction Time Widget
    </title>


    <style>

        :root {
            --dfpa-green: #2e7d32;
            --dfpa-blue: #33439a;
            --dfpa-yellow: #d8a900;
            --dfpa-red: #c62828;
            --dfpa-text: #222222;
            --dfpa-background: #ffffff;
        }


        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            padding: 0;
            background: transparent;
        }


        body {
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color:
                var(--dfpa-text);
        }


        .widget {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            padding: 18px 20px;

            background:
                var(--dfpa-background);

            border: 4px solid
                var(--dfpa-yellow);

            border-radius: 8px;

            text-align: center;
        }


        .widget-title {
            margin: 0 0 8px;

            font-size: 14px;
            font-weight: bold;

            text-transform:
                uppercase;

            letter-spacing:
                0.04em;
        }


        .widget-message {
            margin: 0;

            font-size: 20px;
            line-height: 1.35;

            font-weight: bold;
        }


        .widget-status {
            margin-top: 8px;

            font-size: 13px;
            font-weight: normal;
        }


        .widget.loading {
            border-color:
                var(--dfpa-blue);
        }


        .widget.low {
            border-color:
                var(--dfpa-green);
        }


        .widget.moderate {
            border-color:
                var(--dfpa-blue);
        }


        .widget.high {
            border-color:
                var(--dfpa-yellow);
        }


        .widget.extreme {
            border-color:
                var(--dfpa-red);
        }


        .widget.inactive {
            border-color:
                var(--dfpa-green);
        }


        @media (max-width: 600px) {

            .widget {
                padding: 15px 16px;
            }


            .widget-message {
                font-size: 17px;
            }


            .widget-status {
                font-size: 12px;
            }

        }

    </style>

</head>


<body>


    <section
        id="restrictionWidget"
        class="widget loading"
        aria-labelledby="widgetTitle"
    >

        <h1
            id="widgetTitle"
            class="widget-title"
        >
            Public Use Restrictions
        </h1>


        <p
            id="widgetMessage"
            class="widget-message"
            role="status"
            aria-live="polite"
            aria-atomic="true"
        >
            Loading...
        </p>


        <p
            id="widgetStatus"
            class="widget-status"
            aria-live="polite"
            aria-atomic="true"
        >
            Checking current DFPA fire restrictions.
        </p>

    </section>


    <script>

        const widget =
            document.getElementById(
                "restrictionWidget"
            );


        const widgetMessage =
            document.getElementById(
                "widgetMessage"
            );


        const widgetStatus =
            document.getElementById(
                "widgetStatus"
            );


        const LEVEL_CONFIG = {

            LOW: {
                className:
                    "low",

                message:
                    "Allowed all day."
            },

            MODERATE: {
                className:
                    "moderate",

                message:
                    "Allowed before 1 PM or after 8 PM."
            },

            HIGH: {
                className:
                    "high",

                message:
                    "Allowed before 10 AM or after 8 PM."
            },

            EXTREME: {
                className:
                    "extreme",

                message:
                    "Prohibited."
            }

        };


        function setWidgetState(
            stateClass,
            message,
            statusText
        ) {

            widget.classList.remove(
                "loading",
                "low",
                "moderate",
                "high",
                "extreme",
                "inactive"
            );


            widget.classList.add(
                stateClass
            );


            widgetMessage.textContent =
                message;


            widgetStatus.textContent =
                statusText;


            widget.setAttribute(
                "aria-label",
                `Public Use Restrictions: ${message}`
            );

        }


        function formatPacificTime(
            value
        ) {

            if (!value) {
                return "";
            }


            const date =
                new Date(value);


            if (
                Number.isNaN(
                    date.getTime()
                )
            ) {
                return "";
            }


            return date.toLocaleTimeString(
                "en-US",
                {
                    timeZone:
                        "America/Los_Angeles",
                    hour:
                        "numeric",
                    minute:
                        "2-digit"
                }
            );

        }


        async function loadWidgetData() {

            try {

                const [
                    statusResponse,
                    seasonResponse
                ] =
                    await Promise.all([
                        fetch(
                            "/api/public-status",
                            {
                                cache:
                                    "no-store"
                            }
                        ),

                        fetch(
                            "/api/fire-season",
                            {
                                cache:
                                    "no-store"
                            }
                        )
                    ]);


                if (
                    !statusResponse.ok ||
                    !seasonResponse.ok
                ) {

                    throw new Error(
                        "Unable to load DFPA status."
                    );
                }


                const statusData =
                    await statusResponse.json();


                const seasonData =
                    await seasonResponse.json();


                if (
                    !statusData.success ||
                    !seasonData.success
                ) {

                    throw new Error(
                        "Unable to load DFPA status."
                    );
                }


                /*
                 * Fire Season inactive:
                 * allow all day.
                 */

                const season =
                    seasonData.current;


                if (
                    !season ||
                    String(
                        season.status
                    ).toUpperCase() !==
                        "ACTIVE"
                ) {

                    setWidgetState(
                        "inactive",
                        "Allowed all day.",
                        "Fire season is inactive."
                    );


                    return;
                }


                /*
                 * Current Fire Danger / PUR level.
                 *
                 * The public-status API already resolves
                 * the currently effective change, so the
                 * widget automatically changes when a
                 * scheduled change takes effect.
                 */

                const level =
                    String(
                        statusData
                            .current
                            ?.fire_restrictions
                            ?.level ||
                        ""
                    )
                        .toUpperCase()
                        .trim();


                const config =
                    LEVEL_CONFIG[level];


                if (!config) {

                    setWidgetState(
                        "moderate",
                        "Restriction information unavailable.",
                        "Please check the current DFPA Public Use Restrictions."
                    );


                    return;
                }


                /*
                 * LOW
                 */

                if (
                    level === "LOW"
                ) {

                    setWidgetState(
                        config.className,
                        config.message,
                        "Current Fire Danger/PUR level: LOW."
                    );


                    return;
                }


                /*
                 * EXTREME
                 */

                if (
                    level === "EXTREME"
                ) {

                    setWidgetState(
                        config.className,
                        config.message,
                        "Current Fire Danger/PUR level: EXTREME."
                    );


                    return;
                }


                /*
                 * MODERATE and HIGH use time restrictions.
                 *
                 * Evaluate the current time in the
                 * America/Los_Angeles timezone.
                 */

                const now =
                    new Date();


                const pacificParts =
                    new Intl.DateTimeFormat(
                        "en-US",
                        {
                            timeZone:
                                "America/Los_Angeles",
                            hour:
                                "numeric",
                            minute:
                                "numeric",
                            hourCycle:
                                "h23"
                        }
                    )
                        .formatToParts(
                            now
                        );


                let hour =
                    0;


                let minute =
                    0;


                pacificParts.forEach(
                    part => {

                        if (
                            part.type ===
                            "hour"
                        ) {

                            hour =
                                Number(
                                    part.value
                                );
                        }


                        if (
                            part.type ===
                            "minute"
                        ) {

                            minute =
                                Number(
                                    part.value
                                );
                        }

                    }
                );


                const currentMinutes =
                    (
                        hour *
                        60
                    ) +
                    minute;


                const morningCutoff =
                    level === "MODERATE"
                        ? 13 * 60
                        : 10 * 60;


                const eveningStart =
                    20 * 60;


                const currentlyAllowed =
                    currentMinutes <
                        morningCutoff ||
                    currentMinutes >=
                        eveningStart;


                if (
                    currentlyAllowed
                ) {

                    const allowedUntil =
                        currentMinutes <
                            morningCutoff
                            ? (
                                level ===
                                    "MODERATE"
                                    ? "1 PM"
                                    : "10 AM"
                            )
                            : "10 AM tomorrow";


                    setWidgetState(
                        config.className,
                        "Allowed now.",
                        `Current Fire Danger/PUR level: ${level}. Allowed until ${allowedUntil}.`
                    );


                    return;
                }


                setWidgetState(
                    config.className,
                    "Restricted right now.",
                    `Current Fire Danger/PUR level: ${level}. Allowed after 8 PM.`
                );


            } catch (error) {

                console.error(
                    "DFPA restriction widget error:",
                    error
                );


                setWidgetState(
                    "moderate",
                    "Restriction information unavailable.",
                    "Please check the current DFPA Public Use Restrictions."
                );

            }

        }


        /*
         * Initial load.
         */

        loadWidgetData();


        /*
         * Check periodically so the widget
         * changes automatically when the time
         * crosses a restriction boundary.
         */

        setInterval(
            loadWidgetData,
            60000
        );

    </script>


</body>

</html>

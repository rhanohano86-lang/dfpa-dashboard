<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        DFPA Public Use Restrictions
    </title>


    <style>

        :root {
            --dfpa-green: #2e7d32;
            --dfpa-blue: #33439a;
            --dfpa-yellow: #d8a900;
            --dfpa-red: #c62828;
            --dfpa-text: #222222;
            --dfpa-background: #ffffff;
        }


        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            padding: 0;
            background: transparent;
        }


        body {
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color:
                var(--dfpa-text);
        }


        .widget {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            padding: 18px 20px;

            background:
                var(--dfpa-background);

            border: 4px solid
                var(--dfpa-yellow);

            border-radius: 8px;

            text-align: center;
        }


        .widget-title {
            margin: 0 0 8px;

            font-size: 14px;
            font-weight: bold;

            text-transform:
                uppercase;

            letter-spacing:
                0.04em;
        }


        .widget-level {
            margin: 0 0 8px;

            font-size: 20px;
            line-height: 1.35;

            font-weight: bold;
        }


        .widget-message {
            margin: 0;

            font-size: 17px;
            line-height: 1.4;

            font-weight: normal;
        }


        .widget.loading {
            border-color:
                var(--dfpa-blue);
        }


        .widget.low {
            border-color:
                var(--dfpa-green);
        }


        .widget.moderate {
            border-color:
                var(--dfpa-blue);
        }


        .widget.high {
            border-color:
                var(--dfpa-yellow);
        }


        .widget.extreme {
            border-color:
                var(--dfpa-red);
        }


        .widget.inactive {
            border-color:
                var(--dfpa-green);
        }


        @media (max-width: 600px) {

            .widget {
                padding: 15px 16px;
            }


            .widget-level {
                font-size: 18px;
            }


            .widget-message {
                font-size: 15px;
            }

        }

    </style>

</head>


<body>


    <section
        id="restrictionWidget"
        class="widget loading"
        aria-labelledby="widgetTitle"
    >

        <h1
            id="widgetTitle"
            class="widget-title"
        >
            Public Use Restrictions
        </h1>


        <p
            id="widgetLevel"
            class="widget-level"
            role="status"
            aria-live="polite"
            aria-atomic="true"
        >
            Loading...
        </p>


        <p
            id="widgetMessage"
            class="widget-message"
            role="status"
            aria-live="polite"
            aria-atomic="true"
        >
            Loading current restriction information.
        </p>

    </section>


    <script>

        const widget =
            document.getElementById(
                "restrictionWidget"
            );


        const widgetLevel =
            document.getElementById(
                "widgetLevel"
            );


        const widgetMessage =
            document.getElementById(
                "widgetMessage"
            );


        const LEVEL_CONFIG = {

            LOW: {
                className:
                    "low",

                message:
                    "Allowed all day."
            },

            MODERATE: {
                className:
                    "moderate",

                message:
                    "Allowed before 1 PM or after 8 PM."
            },

            HIGH: {
                className:
                    "high",

                message:
                    "Allowed before 10 AM or after 8 PM."
            },

            EXTREME: {
                className:
                    "extreme",

                message:
                    "Prohibited at all times."
            }

        };


        function setWidgetState(
            stateClass,
            levelText,
            restrictionText
        ) {

            widget.classList.remove(
                "loading",
                "low",
                "moderate",
                "high",
                "extreme",
                "inactive"
            );


            widget.classList.add(
                stateClass
            );


            widgetLevel.textContent =
                levelText;


            widgetMessage.textContent =
                restrictionText;


            widget.setAttribute(
                "aria-label",
                `Public Use Restrictions: ${levelText}. ${restrictionText}`
            );

        }


        async function loadWidgetData() {

            try {

                const [
                    statusResponse,
                    seasonResponse
                ] =
                    await Promise.all([
                        fetch(
                            "/api/public-status",
                            {
                                cache:
                                    "no-store"
                            }
                        ),

                        fetch(
                            "/api/fire-season",
                            {
                                cache:
                                    "no-store"
                            }
                        )
                    ]);


                if (
                    !statusResponse.ok ||
                    !seasonResponse.ok
                ) {

                    throw new Error(
                        "Unable to load DFPA status."
                    );
                }


                const statusData =
                    await statusResponse.json();


                const seasonData =
                    await seasonResponse.json();


                if (
                    !statusData.success ||
                    !seasonData.success
                ) {

                    throw new Error(
                        "Unable to load DFPA status."
                    );
                }


                /*
                 * Fire season inactive:
                 * Allowed all day.
                 */

                const season =
                    seasonData.current;


                if (
                    !season ||
                    String(
                        season.status
                    ).toUpperCase() !==
                        "ACTIVE"
                ) {

                    setWidgetState(
                        "inactive",
                        "Allowed all day.",
                        "Fire season is inactive."
                    );


                    return;
                }


                /*
                 * Get the current effective
                 * Fire Danger / Public Use
                 * Restriction level.
                 */

                const level =
                    String(
                        statusData
                            .current
                            ?.fire_restrictions
                            ?.level ||
                        ""
                    )
                        .toUpperCase()
                        .trim();


                const config =
                    LEVEL_CONFIG[level];


                if (!config) {

                    setWidgetState(
                        "moderate",
                        "Information unavailable.",
                        "Please check the current DFPA Public Use Restrictions."
                    );


                    return;
                }


                /*
                 * Display the current level
                 * and its complete restriction
                 * language.
                 */

                setWidgetState(
                    config.className,
                    level,
                    config.message
                );


            } catch (error) {

                console.error(
                    "DFPA restriction widget error:",
                    error
                );


                setWidgetState(
                    "moderate",
                    "Information unavailable.",
                    "Please check the current DFPA Public Use Restrictions."
                );

            }

        }


        /*
         * Initial load.
         */

        loadWidgetData();


        /*
         * Check periodically so the widget
         * automatically reflects the current
         * effective Fire Danger/PUR level.
         */

        setInterval(
            loadWidgetData,
            60000
        );

    </script>


</body>

</html>

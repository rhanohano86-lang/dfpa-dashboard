
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DFPA Motor Vehicles</title>

    <style>
        :root {
            --dfpa-blue: #33439A;
            --low: #4CAF50;
            --moderate: #1976D2;
            --high: #F4C430;
            --extreme: #D32F2F;
            --inactive: #6B7280;
            --text: #1A1A1A;
            --muted: #6B7280;
            --card: #FFFFFF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: transparent;
            color: var(--text);
        }

        .motor-vehicles-card {
            width: 100%;
            background: var(--card);
            border-radius: 18px;
            padding: 28px 32px;
            border: 2px solid #E5E7EB;
            box-shadow: 0 6px 20px rgba(0, 0, 0, .08);
        }

        .widget-title {
            font-size: 1.7rem;
            font-weight: 700;
            line-height: 1.15;
            margin-bottom: 22px;
            color: var(--dfpa-blue);
            letter-spacing: .02em;
        }

        .status-label {
            font-size: 1rem;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: .04em;
            margin-bottom: 8px;
        }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            background: #FFFFFF;
            border: 2px solid #D1D5DB;
            border-left: 7px solid;
            border-radius: 10px;
            width: 100%;
        }

        .status-dot {
            width: 11px;
            height: 11px;
            min-width: 11px;
            border-radius: 50%;
        }

        .status-level {
            font-size: 1.45rem;
            font-weight: 700;
            line-height: 1.2;
        }

        .restriction {
            margin-top: 16px;
            font-size: 1.2rem;
            font-weight: 700;
            line-height: 1.4;
        }

        .status-low {
            border-left-color: var(--low);
        }

        .status-low .status-dot {
            background: var(--low);
        }

        .status-moderate {
            border-left-color: var(--moderate);
        }

        .status-moderate .status-dot {
            background: var(--moderate);
        }

        .status-high {
            border-left-color: var(--high);
        }

        .status-high .status-dot {
            background: var(--high);
        }

        .status-extreme {
            border-left-color: var(--extreme);
        }

        .status-extreme .status-dot {
            background: var(--extreme);
        }

        .inactive {
            border-left-color: var(--inactive);
        }

        .inactive .status-dot {
            background: var(--inactive);
        }

        .loading, .error {
            color: var(--muted);
            font-size: 1rem;
            line-height: 1.5;
        }

        @media (max-width: 600px) {
            .motor-vehicles-card {
                padding: 20px;
                border-radius: 12px;
            }

            .widget-title {
                font-size: 1.35rem;
                margin-bottom: 16px;
            }

            .status-label {
                font-size: .8rem;
            }

            .status-pill {
                padding: 11px 14px;
                border-left-width: 6px;
            }

            .status-level {
                font-size: 1.2rem;
            }

            .restriction {
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>
    <main>
        <section
            class="motor-vehicles-card"
            aria-labelledby="motor-vehicles-heading"
        >
            <h1
                class="widget-title"
                id="motor-vehicles-heading"
            >
                MOTOR VEHICLES
            </h1>

            <div id="widget-content" aria-live="polite">
                <div class="loading">
                    Loading current status...
                </div>
            </div>
        </section>
    </main>

    <script>
        /*
         * DFPA MOTOR VEHICLES WIDGET
         *
         * Checks the official fire-season status and
         * current public fire status once on page load.
         *
         * No polling. No automatic refresh.
         */

        const API_BASE =
            "https://dfpa-dashboard.pages.dev";

        function getStatusClass(level) {
            const normalized =
                String(level || "").toUpperCase();

            if (normalized === "LOW") return "status-low";
            if (normalized === "MODERATE") return "status-moderate";
            if (normalized === "HIGH") return "status-high";
            if (normalized === "EXTREME") return "status-extreme";

            return "inactive";
        }

        function getRestrictionText(level) {
            const normalized =
                String(level || "").toUpperCase();

            if (normalized === "LOW") {
                return "Allowed with Landowner Permission";
            }

            return "Restricted at all times";
        }

        function displayStatus(level, seasonInactive) {
            const widgetContent =
                document.getElementById("widget-content");

            if (!widgetContent) return;

            const statusClass = seasonInactive
                ? "inactive"
                : getStatusClass(level);

            const label = seasonInactive
                ? "Fire Season Status"
                : "Current Fire Danger";

            const restriction = seasonInactive
                ? "Fire season has ended. Seasonal motor vehicle restrictions are inactive."
                : getRestrictionText(level);

            widgetContent.innerHTML = `
                <div class="status-label">
                    ${label}
                </div>

                <div
                    class="status-pill ${statusClass}"
                    role="status"
                    aria-label="${label}: ${level}"
                >
                    <span
                        class="status-dot"
                        aria-hidden="true"
                    ></span>

                    <span class="status-level">
                        ${level}
                    </span>
                </div>

                <div class="restriction">
                    ${restriction}
                </div>
            `;
        }

        function displayError() {
            const widgetContent =
                document.getElementById("widget-content");

            if (!widgetContent) return;

            widgetContent.innerHTML = `
                <div class="error" role="status">
                    Current fire-season information is temporarily
                    unavailable. Please check the DFPA Fire Danger
                    Level Status Dashboard.
                </div>
            `;
        }

        async function loadMotorVehicleStatus() {
            try {
                const [statusResponse, seasonResponse] =
                    await Promise.all([
                        fetch(
                            `${API_BASE}/api/public-status`,
                            { cache: "no-store" }
                        ),
                        fetch(
                            `${API_BASE}/api/fire-season`,
                            { cache: "no-store" }
                        )
                    ]);

                if (!statusResponse.ok || !seasonResponse.ok) {
                    throw new Error("Unable to load DFPA status.");
                }

                const [statusData, seasonData] =
                    await Promise.all([
                        statusResponse.json(),
                        seasonResponse.json()
                    ]);

                if (!statusData.success || !seasonData.success) {
                    throw new Error("Invalid DFPA status response.");
                }

                /*
                 * After the season ends, current is null.
                 * The most recent season remains in history.
                 */
                const season =
                    seasonData.current ||
                    (
                        Array.isArray(seasonData.history)
                            ? seasonData.history[0]
                            : null
                    );

                if (!season || !season.status) {
                    throw new Error("Season status unavailable.");
                }

                const seasonStatus =
                    String(season.status).toUpperCase();

                if (seasonStatus === "INACTIVE") {
                    displayStatus("INACTIVE", true);
                    return;
                }

                if (seasonStatus !== "ACTIVE") {
                    throw new Error("Unrecognized season status.");
                }

                const level =
                    statusData.current?.fire_restrictions?.level;

                if (!level) {
                    throw new Error("Fire danger level unavailable.");
                }

                displayStatus(level, false);

            } catch (error) {
                console.error(
                    "Motor Vehicles widget error:",
                    error
                );

                displayError();
            }
        }

        // Load once. Intentionally no timer or polling.
        document.addEventListener(
            "DOMContentLoaded",
            loadMotorVehicleStatus
        );
    </script>
</body>
</html>
